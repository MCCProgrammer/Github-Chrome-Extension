<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>GitHub Repo Folders</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="app-header">
    <img class="logo" src="icons/icon48.png" alt="">
    <div class="app-title">
      <strong>Repo Folders</strong>
      <span id="subtitle" class="subtitle"></span>
    </div>
    <a id="profileLink" class="avatar-link" target="_blank" rel="noopener" hidden>
      <img id="avatar" class="avatar" alt="">
    </a>
    <button id="refreshBtn" class="btn-icon" type="button" title="Atualizar repositórios" aria-label="Atualizar repositórios"></button>
    <button id="settingsBtn" class="btn-icon" type="button" title="Definições" aria-label="Definições"></button>
  </header>

  <section id="settings" class="settings" hidden>
    <div class="box">
      <div class="box-header">Conta</div>
      <div class="box-body">
        <div class="account">
          <img id="accountAvatar" class="avatar avatar-lg" alt="">
          <div class="account-info">
            <strong id="accountLogin"></strong>
            <span class="field-hint">Detetada automaticamente a partir da sessão iniciada no GitHub.
              Para usar outra conta, troca de conta no GitHub: cada conta tem as suas pastas.</span>
          </div>
        </div>
        <div class="actions">
          <button id="exportBtn" class="btn" type="button">Exportar pastas</button>
          <button id="importBtn" class="btn" type="button">Importar pastas</button>
          <input id="importFile" type="file" accept="application/json" hidden>
        </div>
      </div>
    </div>
  </section>

  <div id="toolbar" class="toolbar">
    <label class="search">
      <span id="searchIcon"></span>
      <input id="searchInput" type="search" placeholder="Procurar repositórios…" autocomplete="off">
    </label>
    <button id="newFolderBtn" class="btn btn-primary" type="button" title="Nova pasta"></button>
  </div>

  <div id="status" class="flash" hidden></div>
  <main id="folders"></main>

  <footer id="footer" class="app-footer">
    <a id="openRepos" target="_blank" rel="noopener">Abrir os meus repositórios no GitHub ↗</a>
  </footer>

  <script src="folders-core.js"></script>
  <script src="github-session.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
